<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragrance | Gold Scents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/store.css">
    <link rel="stylesheet" href="css/store-pages.css">
</head>
<body>
    <div class="announcement-bar">
        <button type="button" data-announcement-prev aria-label="Previous">‹</button>
        <span data-announcement-text>Free consultation with every fragrance order</span>
        <button type="button" data-announcement-next aria-label="Next">›</button>
    </div>

    <header class="site-header inner-header">
        <a class="logo" href="index.html" aria-label="Gold Scents home">
            <img class="logo-image" src="image/gold_scents_logo.png" alt="">
            <div class="logo-mark">
                <h1 class="logo-text">gold<span>scents</span></h1>
                <small>Fine Fragrances</small>
            </div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#collection">Collection</a>
            <a href="track.html">Track</a>
            <a href="cart.html">Cart <span class="cart-icon" id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="page-shell has-solid-header">
        <div id="product-detail" class="panel">
            <p class="empty-state">Loading fragrance...</p>
        </div>
        <div style="width:min(860px,92%);margin:-30px auto 40px;">
            <a href="index.html#collection" class="back-link">← Back to Collection</a>
        </div>
    </main>

    <script src="js/constants.js"></script>
    <script src="js/cart_store.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/layout.js"></script>
    <script>
        let cart = load_cart();
        document.getElementById('cart-count').innerText = get_cart_count(cart);
        const product_id = parseInt(new URLSearchParams(window.location.search).get('id'), 10);

        async function load_product() {
            const detail = document.getElementById('product-detail');
            if (!product_id) {
                detail.innerHTML = '<p class="empty-state">Product not found.</p>';
                return;
            }

            try {
                const response = await fetch(`api/product.php?id=${product_id}`);
                const product = await response.json();
                if (!response.ok || !product.id) {
                    detail.innerHTML = '<p class="empty-state">This fragrance is unavailable.</p>';
                    return;
                }

                document.title = `${product.products_name} | Gold Scents`;
                const stock = parseInt(product.stock_quantity, 10) || 0;
                const out_of_stock = stock < MIN_STOCK_AVAILABLE;

                detail.innerHTML = `
                    <div class="detail-layout">
                        <img class="detail-image" src="${escape_html(product.image_url)}" alt="${escape_html(product.products_name)}">
                        <div class="detail-copy">
                            <h1>${escape_html(product.products_name)}</h1>
                            <p class="product-card__notes">${escape_html(product.notes || 'Signature notes coming soon.')}</p>
                            <p class="product-card__price">${format_money(product.price)}</p>
                            <p class="product-card__notes">${out_of_stock ? 'Sold out' : `${stock} in stock`}</p>
                            <div class="product-card__actions" style="opacity:1;transform:none;max-width:320px;margin-top:24px;">
                                <button class="add-btn" id="detail-add-btn" type="button" ${out_of_stock ? 'disabled' : ''}>
                                    ${out_of_stock ? 'Sold Out' : 'Add To Cart'}
                                </button>
                                <a class="wa-btn" href="${build_whatsapp_product_link(product.products_name)}" target="_blank" rel="noopener">
                                    Order on WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('detail-add-btn').addEventListener('click', () => {
                    const result = add_item_to_cart(cart, {
                        id: parseInt(product.id, 10),
                        name: product.products_name,
                        price: product.price,
                    }, stock);
                    cart = result.cart;
                    if (!result.added) {
                        show_toast('Unable to add this item.', 'error');
                        return;
                    }
                    document.getElementById('cart-count').innerText = get_cart_count(cart);
                    show_toast(`Added ${product.products_name} to cart`);
                });
            } catch (error) {
                detail.innerHTML = '<p class="empty-state">Could not load this fragrance.</p>';
            }
        }

        load_product();
    </script>
</body>
</html>
