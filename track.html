<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | Gold Scents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/store.css">
    <link rel="stylesheet" href="css/store-pages.css">
</head>
<body>
    <div class="announcement-bar">Track your fragrance order anytime</div>

    <header class="site-header">
        <div class="logo-mark">
            <h1 class="logo-text">goldscents</h1>
            <small>Luxury fragrance vault</small>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="track.html">Track Order</a>
            <a href="cart.html">Cart <span class="cart-icon" id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="container">
        <div class="panel">
            <h2>Track Your Order</h2>
            <p style="color:var(--muted);margin-top:0;">
                Enter your order ID and the email or phone used at checkout.
            </p>

            <form id="track-form">
                <div class="form-group">
                    <label for="order-id">Order ID</label>
                    <input type="number" id="order-id" required min="1" placeholder="e.g. 4">
                </div>
                <div class="form-group">
                    <label for="lookup-value">Email or Phone</label>
                    <input type="text" id="lookup-value" required placeholder="you@example.com or 0XX XXX XXXX">
                </div>
                <button type="submit" class="btn btn-dark checkout-btn">Check Status</button>
            </form>

            <div id="track-result" style="margin-top:28px;"></div>
            <a href="index.html" class="back-link">← Back to Store</a>
        </div>
    </main>

    <script src="js/constants.js"></script>
    <script src="js/cart_store.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/order_helpers.js"></script>
    <script>
        document.getElementById('cart-count').innerText = get_cart_count(load_cart());

        const params = new URLSearchParams(window.location.search);
        const preset_order_id = params.get('order_id');
        if (preset_order_id) {
            document.getElementById('order-id').value = preset_order_id;
        }

        const last_order = load_last_order();
        if (last_order && last_order.customer_email && !document.getElementById('lookup-value').value) {
            document.getElementById('lookup-value').value = last_order.customer_email;
        }

        document.getElementById('track-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const order_id = document.getElementById('order-id').value.trim();
            const lookup_value = document.getElementById('lookup-value').value.trim();
            const result_host = document.getElementById('track-result');

            try {
                const response = await fetch(
                    `api/get_order.php?order_id=${encodeURIComponent(order_id)}&lookup=${encodeURIComponent(lookup_value)}`
                );
                const result = await response.json();

                if (!result.success) {
                    result_host.innerHTML = `<p class="empty-state">${escape_html(result.error || 'Order not found.')}</p>`;
                    show_toast(result.error || 'Order not found.', 'error');
                    return;
                }

                const order = result.order;
                const items_html = order.items.map((item) => `
                    <li>
                        <span>${escape_html(item.product_name)} × ${item.quantity}</span>
                        <strong>${format_money(item.price * item.quantity)}</strong>
                    </li>
                `).join('');

                result_host.innerHTML = `
                    <div class="order-summary">
                        <h3>Order #${order.id}</h3>
                        ${render_status_tracker(order.status)}
                        <p class="summary-meta">
                            Placed ${escape_html(order.created_at)} · Status:
                            <strong>${ORDER_STATUS_LABELS[order.status] || escape_html(order.status)}</strong>
                        </p>
                        <ul>${items_html}</ul>
                        <p class="summary-total"><span>Total</span><strong>${format_money(order.total_price)}</strong></p>
                        <p class="summary-meta">${escape_html(order.customer_name)} · ${escape_html(order.customer_phone)}</p>
                        <p class="summary-meta">Ship to: ${escape_html(order.delivery_address)}</p>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                show_toast('Could not look up this order.', 'error');
            }
        });
    </script>
</body>
</html>
