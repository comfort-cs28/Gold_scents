<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Gold Scents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/store.css">
    <link rel="stylesheet" href="css/store-pages.css">
</head>
<body>
    <div class="announcement-bar">
        <button type="button" data-announcement-prev aria-label="Previous">‹</button>
        <span data-announcement-text>Thank you for shopping with Gold Scents</span>
        <button type="button" data-announcement-next aria-label="Next">›</button>
    </div>

    <header class="site-header inner-header">
        <a class="logo" href="index.html" aria-label="Gold Scents home">
            <img class="logo-image" src="image/gold_scents_logo.png" alt="">
            <div class="logo-mark">
                <h1 class="logo-text">gold<span>scents</span></h1>
                <small>Fine Fragrances</small>
            </div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="track.html">Track</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="page-shell has-solid-header">
        <div class="panel success-box">
            <h2>Order Confirmed</h2>
            <p style="color:var(--muted);">Thank you. We received your order and will verify your MoMo payment shortly.</p>
            <div class="order-id" id="order-id-label">Order #—</div>
            <div id="status-tracker-host"></div>
            <div id="order-summary"></div>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px;">
                <a class="btn" href="index.html">Continue Shopping</a>
                <a class="btn btn-ghost" id="track-link" href="track.html">Track This Order</a>
                <a class="btn btn-ghost" id="wa-link" href="https://wa.me/233534048714" target="_blank" rel="noopener">Notify on WhatsApp</a>
            </div>
        </div>
    </main>

    <script src="js/constants.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/order_helpers.js"></script>
    <script src="js/layout.js"></script>
    <script>
        const order_id = new URLSearchParams(window.location.search).get('order_id');
        const last_order = load_last_order();
        if (order_id) {
            document.getElementById('order-id-label').textContent = `Order #${order_id}`;
            document.getElementById('track-link').href = `track.html?order_id=${encodeURIComponent(order_id)}`;
        }
        if (last_order && String(last_order.order_id) === String(order_id)) {
            document.getElementById('status-tracker-host').innerHTML = render_status_tracker(last_order.status || ORDER_STATUS.PENDING);
            const items_html = (last_order.items || []).map((item) => `
                <li><span>${escape_html(item.name)} × ${item.quantity}</span><strong>${format_money(item.price * item.quantity)}</strong></li>
            `).join('');
            const summary = document.getElementById('order-summary');
            summary.className = 'order-summary';
            summary.innerHTML = `
                <h3>Order Summary</h3>
                <ul>${items_html}</ul>
                <p class="summary-total"><span>Total</span><strong>${format_money(last_order.total_price)}</strong></p>
            `;
            document.getElementById('wa-link').href = build_seller_whatsapp_link(last_order);
        } else if (order_id) {
            document.getElementById('status-tracker-host').innerHTML = render_status_tracker(ORDER_STATUS.PENDING);
        }
    </script>
</body>
</html>
