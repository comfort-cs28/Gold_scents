<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Gold Scents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/store.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1 class="logo-text">Gold Scents</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="track.html">Track Order</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="container">
        <div class="panel success-box">
            <h2 style="border:none;padding:0;">Order Confirmed</h2>
            <p style="color:var(--muted);font-size:1.15rem;">
                Thank you. We received your order and will verify your MoMo payment shortly.
            </p>
            <div class="order-id" id="order-id-label">Order #—</div>
            <div id="status-tracker-host"></div>
            <div id="order-summary"></div>
            <p style="color:var(--muted);">
                Save your order ID. You can track status anytime, or notify us on WhatsApp.
            </p>
            <div class="hero-actions" style="justify-content:center;margin-top:28px;">
                <a class="btn" href="index.html">Continue Shopping</a>
                <a class="btn btn-ghost" id="track-link" href="track.html">Track This Order</a>
                <a class="btn btn-ghost" id="wa-link" href="https://wa.me/233534048714" target="_blank" rel="noopener">Notify on WhatsApp</a>
            </div>
        </div>
    </main>

    <script src="js/constants.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/order_helpers.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const order_id = params.get('order_id');
        const label = document.getElementById('order-id-label');
        const summary = document.getElementById('order-summary');
        const tracker_host = document.getElementById('status-tracker-host');
        const last_order = load_last_order();

        if (order_id) {
            label.textContent = `Order #${order_id}`;
            document.getElementById('track-link').href = `track.html?order_id=${encodeURIComponent(order_id)}`;
        }

        if (last_order && String(last_order.order_id) === String(order_id)) {
            tracker_host.innerHTML = render_status_tracker(last_order.status || ORDER_STATUS.PENDING);

            const items_html = (last_order.items || []).map((item) => `
                <li>
                    <span>${escape_html(item.name)} × ${item.quantity}</span>
                    <strong>${format_money(item.price * item.quantity)}</strong>
                </li>
            `).join('');

            summary.className = 'order-summary';
            summary.innerHTML = `
                <h3>Order Summary</h3>
                <ul>${items_html}</ul>
                <p class="summary-total"><span>Total</span><strong>${format_money(last_order.total_price)}</strong></p>
                <p class="summary-meta">${escape_html(last_order.customer_name)} · ${escape_html(last_order.customer_phone)}</p>
            `;

            document.getElementById('wa-link').href = build_seller_whatsapp_link(last_order);
        } else if (order_id) {
            tracker_host.innerHTML = render_status_tracker(ORDER_STATUS.PENDING);
            document.getElementById('wa-link').href =
                `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Hi Gold Scents! I just placed order #' + order_id)}`;
        }
    </script>
</body>
</html>
